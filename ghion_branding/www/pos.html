<!doctype html>
{% set user_lang = frappe.lang or 'en' %}
{% set is_rtl = user_lang in ['ar', 'he', 'fa', 'ur', 'ku'] %}
<html lang="{{ user_lang }}" dir="{{ 'rtl' if is_rtl else 'ltr' }}">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/assets/ghion_branding/images/ghion-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Ghion Hotel POS</title>
    <script type="module" crossorigin src="/assets/ury/pos/assets/index-BlWA5U7H.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/ury/pos/assets/index-Cy0I7Q_a.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.csrf_token = "{{ csrf_token }}";
      if (!window.frappe) window.frappe = {};
      window.app_name = "{{ app_name }}";
      frappe.boot = JSON.parse({{ boot }});
    </script>
  </body>
</html>
